[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "0x373B41"
blue = "0x7AA2F7"
cyan = "0x7DCFFF"
green = "0x9ECE6A"
magenta = "0xFB85FF"
red = "0xF7768E"
white = "0xC5C8C6"
yellow = "0xFFDA73"

[colors.normal]
black = "0x1D1F21"
blue = "0x366AC3"
cyan = "0x2AC3DE"
green = "0x3AA842"
magenta = "0x9843B0"
red = "0xD92057"
white = "0x707880"
yellow = "0xCCA828"

[colors.primary]
background = "0x272833"
foreground = "0xF0F0E6"

[cursor]
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 11.5

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.offset]
x = 0
y = 0

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[general]
live_config_reload = true

[terminal]

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 100000
multiplier = 1

[selection]
save_to_clipboard = true
semantic_escape_chars = """,│`|:"' ()[]{}<>"""

[terminal.shell]
program = "/usr/bin/zsh"

[window]
decorations = "full"
dynamic_padding = false

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 1
y = 1

[keyboard]
